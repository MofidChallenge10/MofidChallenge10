<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16" viewBox="0 0 900 16" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee8fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ee8fa"/>
      <stop offset="1" stop-color="#eec0c6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="40" y1="8" x2="860" y2="8" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <circle cx="450" cy="8" r="4" fill="#7ee8fa">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
