<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-label="MofidChallenge10 avatar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.55" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee8fa"/>
      <stop offset="1" stop-color="#eec0c6"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bg)"/>
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#ring)" stroke-width="10" stroke-dasharray="40 16" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 250 250" to="360 250 250" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="250" r="150" fill="#0b1a20" opacity="0.7"/>
  <text x="250" y="292" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="150" font-weight="800" fill="url(#ring)">MC</text>
  <text x="250" y="345" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="30" fill="#e6f1f5">&lt;/&gt;</text>
</svg>
